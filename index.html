<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>打单与上线率核对台</title>
<style>
/* Layout: sticky label-strip header (date = batch), tab rail, single working column of panels */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --surface-2:#e9ebe5; --ink:#19201c; --ink-2:#4a524d; --muted:#7a827d; --line:#d5d9d1; --line-2:#aeb4ab; --zebra:#f7f8f5;
  --accent:#1f5c86; --accent-soft:#e2ecf4; --accent-ink:#ffffff;
  --manual:#e5f1e0; --manual-line:#93c08d;
  --red:#b9302a; --red-bg:#fae6e3; --orange:#b4600f; --orange-bg:#fbeedd; --yellow:#8a6d00; --yellow-bg:#f8f1cf; --green:#2a7330; --green-bg:#e2f0e1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1b201d; --surface-2:#242a26; --ink:#e7ebe8; --ink-2:#b3bbb6; --muted:#868f8a; --line:#323935; --line-2:#4b544f; --zebra:#202522;
  --accent:#74a9d4; --accent-soft:#1d2b36; --accent-ink:#0f1a22;
  --manual:#1d3020; --manual-line:#4f8150;
  --red:#ef7b71; --red-bg:#3a1f1c; --orange:#efa258; --orange-bg:#382916; --yellow:#e0c450; --yellow-bg:#332f19; --green:#7cc580; --green-bg:#1c311f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1b201d; --surface-2:#242a26; --ink:#e7ebe8; --ink-2:#b3bbb6; --muted:#868f8a; --line:#323935; --line-2:#4b544f; --zebra:#202522;
  --accent:#74a9d4; --accent-soft:#1d2b36; --accent-ink:#0f1a22;
  --manual:#1d3020; --manual-line:#4f8150;
  --red:#ef7b71; --red-bg:#3a1f1c; --orange:#efa258; --orange-bg:#382916; --yellow:#e0c450; --yellow-bg:#332f19; --green:#7cc580; --green-bg:#1c311f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:17px;font-weight:700;letter-spacing:.01em}
h3{font-size:14px;font-weight:700}
.mono,.trk{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num,td.n,.kpi .v,.man{font-family:var(--f-num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:.01em}
td.n{font-size:13.5px;color:var(--ink)}
.blank{color:var(--muted);opacity:.6}
.muted{color:var(--muted)} .small{font-size:12px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.02em}
.brand .tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stub{display:flex;align-items:stretch;border:1.5px dashed var(--ink-2);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stub .lbl{font-size:11px;letter-spacing:.12em;padding:6px 8px;background:var(--ink);color:var(--bg);display:flex;align-items:center}
.stub button{border:0;background:transparent;padding:0 10px;font-size:16px;color:var(--ink-2)}
.stub button:hover{background:var(--surface-2)}
.stub input{border:0;background:transparent;font-family:var(--f-mono);font-size:15px;padding:5px 4px;width:150px}
.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--green)} .dot.warn{background:var(--orange)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:9px 12px 10px;border-bottom:2.5px solid transparent;color:var(--ink-2);white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--red-bg);color:var(--red)}

main{padding-top:18px;display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.panel>header p{margin:0;color:var(--muted);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.banner{padding:10px 14px;border-radius:var(--r);font-size:13px;border:1px solid}
.banner.warn{background:var(--orange-bg);border-color:var(--orange);color:var(--ink)}
.banner.info{background:var(--accent-soft);border-color:var(--accent)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:23px;font-weight:600}
.kpi .s{font-size:12px;color:var(--ink-2)}

/* chips & severity */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:10px;white-space:nowrap;font-weight:500;border:1px solid transparent}
.c-red{background:var(--red-bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.c-orange{background:var(--orange-bg);color:var(--orange);border-color:color-mix(in srgb,var(--orange) 35%,transparent)}
.c-yellow{background:var(--yellow-bg);color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 35%,transparent)}
.c-green{background:var(--green-bg);color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.c-grey{background:var(--surface-2);color:var(--ink-2)}
.c-blue{background:var(--accent-soft);color:var(--accent)}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);background:var(--surface)}
.alert.red{border-left-color:var(--red)} .alert.orange{border-left-color:var(--orange)} .alert.yellow{border-left-color:var(--yellow)}
.alert .t{font-weight:500} .alert .d{grid-column:2/4;color:var(--ink-2);font-size:12.5px;word-break:break-word}
.alert .go{font-size:12px;border:0;background:none;color:var(--accent);padding:0}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);max-height:560px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:var(--surface-2);font-weight:500;font-size:12px;color:var(--ink-2);z-index:1}
td.n,th.n{text-align:right;padding-left:20px}
tbody tr:nth-child(even) td{background:var(--zebra)}
/* 台账：分组表头 + 组间竖线 + 原因单独一行 */
.ledger th,.ledger td{padding:8px 14px}
.ledger td.n{min-width:104px}
.ledger th.g{text-align:center;border-bottom:1px solid var(--line-2);font-weight:600;color:var(--ink)}
.ledger thead tr:nth-child(2) th{top:34px}
.ledger .sep{border-left:1px solid var(--line-2)}
.ledger tbody tr.r td{border-bottom:0}
.ledger tbody tr.why td{background:transparent;white-space:normal;font-size:12px;color:var(--ink-2);padding-top:0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ledger tbody tr.why td span.lead{color:var(--muted);margin-right:6px}
.ledger tbody tr.r.bad td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.ledger tbody tr.r.ok td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.ledger tbody tr:nth-child(even) td{background:transparent}
.ledger tbody tr.r:hover td,.ledger tbody tr.r:hover+tr.why td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.ledger td.big{font-weight:600}
.ledger td.in{padding:8px 5px}
.ledger .man{width:86px}
.ledger th.in{padding-inline:5px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.wrap{white-space:normal;min-width:200px}
tr.tot td{font-weight:700;background:var(--surface-2)}
.haz{font-size:10.5px;color:var(--red);border:1px solid var(--red);border-radius:3px;padding:0 3px;margin-left:4px}
.pos{color:var(--green)} .neg{color:var(--red)}

/* inputs: green = 手动填写 */
.in{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:4px 7px;min-width:0}
.man{background:var(--manual);border:1px solid var(--manual-line);border-radius:4px;padding:5px 8px;width:108px;text-align:right;font-size:13.5px}
.man.wide{width:auto;text-align:left;font-family:var(--f-body);min-width:120px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
label.f{display:grid;gap:3px;font-size:12px;color:var(--ink-2)}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;background:var(--surface);display:grid;gap:6px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-size:15px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--ink-2);font-size:13px}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);width:0}

/* chart */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bars{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:96px 1fr 92px;gap:10px;align-items:center;font-size:12px}
.btrack{display:flex;gap:2px;height:16px;min-width:0}
.btrack span{height:100%;min-width:2px;position:relative}
.btrack span:first-child{border-radius:0}
.btrack span:last-child{border-radius:0 4px 4px 0}
.bdet>summary{list-style:none;cursor:pointer}.bdet>summary::-webkit-details-marker{display:none}.bdet[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}.bdet .bbody{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:8px;display:grid;gap:8px}.lnk{border:0;background:none;padding:0;cursor:pointer;font:inherit;text-decoration:underline}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;z-index:20;max-width:260px}
details>summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:13px;z-index:30}
@media (max-width:640px){ body{padding-inline:10px} .brand .tag{display:none} .brand h1{font-size:16px} .bar{gap:8px} .panel{padding:12px} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi .v{font-size:18px} .grid2{grid-template-columns:minmax(0,1fr)} th,td{padding:5px 7px} .tabs button{padding:8px 9px 9px} .status{font-size:11.5px} .alert{grid-template-columns:auto minmax(0,1fr) auto}  .brow{grid-template-columns:72px 1fr 70px} .kpi .v{font-size:19px} .stub input{width:128px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="bar">
      <div class="brand"><h1>打单与上线率核对台</h1><span class="tag">Label · Tracking · Balance</span></div>
      <div class="row">
        <div class="stub" title="业务日期 = 打单平台的交单日期（报告里的创建时间）">
          <span class="lbl">打单日</span>
          <button id="dPrev" aria-label="前一个打单日">‹</button>
          <input id="dSel" type="date" aria-label="业务日期">
          <button id="dNext" aria-label="后一个打单日">›</button>
        </div>
        <div class="status" id="stStatus"><span class="dot"></span><span>正在连接多维表格…</span></div>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
  <main id="main"></main>
</div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===== 飞书插件版：数据存进当前多维表格（替代原来的共享数据库） ===== */
(function () {
  'use strict';
  // ---- Excel 读取库：国内地址优先 ----
  var XSRC = [
    'xlsx.full.min.js',
    'https://registry.npmmirror.com/xlsx/0.18.5/files/dist/xlsx.full.min.js',
    'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.staticfile.net/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  var xp = null;
  window.loadXLSX = function () {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (xp) return xp;
    xp = new Promise(function (ok, bad) {
      var i = 0;
      (function next() {
        if (window.XLSX) return ok(window.XLSX);
        if (i >= XSRC.length) { xp = null; return bad(new Error('Excel 读取组件加载失败，请确认能上网后重新打开插件')); }
        var s = document.createElement('script'); var done = false;
        var t = setTimeout(function () { if (!done) { done = true; s.remove(); i++; next(); } }, 10000);
        s.src = XSRC[i];
        s.onload = function () { if (done) return; done = true; clearTimeout(t); if (window.XLSX) ok(window.XLSX); else { i++; next(); } };
        s.onerror = function () { if (done) return; done = true; clearTimeout(t); s.remove(); i++; next(); };
        document.head.appendChild(s);
      })();
    });
    return xp;
  };
  window.loadXLSX().catch(function () {});

  // ---- 飞书多维表格接口组件 ----
  var SDKSRC = [
    'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/dist/index.mjs',
    'https://unpkg.com/@lark-base-open/js-sdk@1.0.2/dist/index.mjs',
    'https://esm.sh/@lark-base-open/js-sdk@1.0.2',
    'https://registry.npmmirror.com/@lark-base-open/js-sdk/1.0.2/files/dist/index.mjs'
  ];
  function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, r) { setTimeout(function () { r(new Error('超时')); }, ms); })]); }
  function loadSDK() {
    if (window.__LARK_SDK__) return Promise.resolve(window.__LARK_SDK__); // 测试用
    var i = 0;
    return new Promise(function (ok, bad) {
      (function next() {
        if (i >= SDKSRC.length) return bad(new Error('飞书接口组件加载失败'));
        withTimeout(import(SDKSRC[i]), 20000).then(ok, function () { i++; next(); });
      })();
    });
  }

  var CHUNK = 40000; // 一个格子实测最多 5 万字，留余量
  var COLS = {
    lab: '存档-打单', wl: '存档-Wavelink', trk: '存档-718', who: '存档-仓库发货',
    note: '存档-跟进备注', spec: '存档-特殊情况', upl: '存档-上传记录', meta: '存档-设置'
  };
  var LEDT = '余额台账';
  var PN = { HYE: 'HYE', TS: 'Timestar', WT: '万通', RK: '如铠', HC: '海承' };
  var PR = {}; Object.keys(PN).forEach(function (k) { PR[PN[k]] = k; PR[k] = k; });
  // 余额台账字段：[字段名, 数据里的键, 类型]
  var LEDF = [['平台', 'p', 'T'], ['日期', 'd', 'T'], ['时间', 'time', 'T'], ['新增额度/充值', 'credit', 'N'], ['水单金额', 'slip', 'N'],
    ['退款', 'refund', 'N'], ['反弹', 'rebound', 'N'], ['线下打单', 'offline', 'N'], ['手填预扣费', 'prepay', 'N'], ['交单后余额', 'close', 'N'],
    ['备注', 'note', 'T'], ['来源', 'src', 'T'], ['更新时间', 'u', 'T']];

  var SDK = null, base = null, FT = null;
  var T = {};        // 表名 -> {table, f:{字段名:id}}
  var IDX = {};      // 'col/id' -> [recordId,...]（按分片顺序）
  var MEM = new Map();
  var lastOwnWrite = 0, changeCb = null;
  var seg = function (s) { return s == null || s === '' ? null : [{ type: 'text', text: String(s) }]; };
  var txt = function (v) { return Array.isArray(v) ? v.map(function (x) { return x && x.text != null ? x.text : ''; }).join('') : (v == null ? '' : String(v)); };
  var clone = function (x) { return JSON.parse(JSON.stringify(x)); };

  function ensureTable(name, fields) {
    // fields: [[名称, 'T'|'N'], ...]，第一个是主字段
    return base.getTableMetaList().then(function (metas) {
      var m = metas.find(function (x) { return x.name === name; });
      var p = m ? base.getTableById(m.id) : base.addTable({ name: name, fields: [{ name: fields[0][0], type: FT.Text }] }).then(function (r) { return base.getTableById(r.tableId); });
      return p.then(function (table) {
        return table.getFieldMetaList().then(function (fm) {
          var have = {}; fm.forEach(function (f) { have[f.name] = f.id; });
          if (!m && fm.length && !have[fields[0][0]]) { have[fields[0][0]] = fm[0].id; }
          var miss = fields.filter(function (f) { return !have[f[0]]; });
          return miss.reduce(function (pr, f) {
            return pr.then(function () {
              if (f[1] === 'L') { // 关联到另一张表；建不了就跳过
                var tg = T[f[2]]; if (!tg || FT.SingleLink == null) return;
                return table.addField({ type: FT.SingleLink, name: f[0], property: { tableId: tg.table.id, multiple: true } })
                  .then(function (id) { have[f[0]] = id; }, function (e) { console.warn('关联字段建不了', e); });
              }
              return table.addField({ type: f[1] === 'N' ? FT.Number : FT.Text, name: f[0] }).then(function (id) { have[f[0]] = id; });
            });
          }, Promise.resolve()).then(function () { T[name] = { table: table, f: have }; });
        });
      });
    });
  }
  function allRecords(table) {
    var out = [];
    function page(tok) {
      return table.getRecords({ pageSize: 100, pageToken: tok }).then(function (r) {
        out = out.concat(r.records || []);
        return r.hasMore ? page(r.pageToken) : out;

  E.rowToLab = (p, r) => mkLabel({ p, wo: r[0], trs: r[1] ? r[1].split(',') : [], dt: r[2], amt: r[3], n: r[4], sku: r[5], ch: r[6], wt: r[7] === '' ? null : r[7], v: r[8], st: r[9] });
  E.wlToRow = (w) => [w.wo, w.trs.join(','), w.skus, w.ch, w.st, w.ot, w.sd, w.pick || ''];
  E.rowToWl = (wh, r) => ({ wh, wo: r[0], trs: r[1] ? r[1].split(',') : [], skus: r[2], ch: r[3], st: r[4], ot: r[5], sd: r[6], pick: r[7] || '' });
  E.tToRow = (t) => [t.tr, t.send, t.carrier, t.st, t.sub, t.last, t.on, t.sign, t.stay == null ? '' : t.stay, t.note];
  // 同一个单号可能存在多天的 718 存档里（718 上线后会把“发货时间”改成上网日），只保留最新上传的那条；旧数据没有上传时间，以最近轨迹时间较晚的为准
  E.dedupT = function (arr) {
    const m = new Map();
    for (const t of arr) {
      t.tr = String(t.tr == null ? '' : t.tr).trim();
      const o = m.get(t.tr);
      if (!o || (t.u || '') > (o.u || '') || ((t.u || '') === (o.u || '') && (t.last || '') > (o.last || ''))) m.set(t.tr, t);
    }
    E.trkDup = arr.length - m.size;
    return [...m.values()];
  };
  E.rowToT = (r) => ({ tr: r[0], send: r[1], carrier: r[2], st: r[3], sub: r[4], last: r[5], on: r[6], sign: r[7], stay: r[8] === '' ? null : r[8], note: r[9], u: r[10] || '' });

  // Group parsed batch into storage docs (merging into existing docs passed as maps)
  // existing: {lab:{id:doc}, wl:{id:doc}, trk:{id:doc}}; returns {docs:[{col,id,data}], cov:{P:[from,to]}}
  E.buildDocs = function (parsed, existing, nowIso) {
    const docs = []; const cov = {};
    const g = {};
    for (const l of parsed.labels) { if (!l.d) continue; const id = l.p + '_' + l.d; (g[id] = g[id] || []).push(l); const c = cov[l.p] || (cov[l.p] = [l.d, l.d]); if (l.d < c[0]) c[0] = l.d; if (l.d > c[1]) c[1] = l.d; }
    for (const id in g) {
      const [p, d] = id.split('_');
      const ex = (existing.lab && existing.lab[id]) ? existing.lab[id].rows : [];
      const m = new Map(); const key = (r) => r[0] + '|' + r[1];
      ex.forEach((r) => m.set(key(r), r));
      // newer rows replace rows with same WO+tracking; a re-uploaded WO also replaces older failed rows of same WO
      for (const l of g[id]) { const r = E.labToRow(l); m.set(key(r), r); }
      docs.push({ col: 'lab', id, data: { p, d, u: nowIso, rows: [...m.values()] } });
    }
    const gw = {};
    for (const w of parsed.wl) { const d = E.day(w.ot) || E.day(w.sd); if (!d) continue; const id = w.wh + '_' + d; (gw[id] = gw[id] || []).push(w); }
    for (const id in gw) {
      const i = id.lastIndexOf('_'); const wh = id.slice(0, i), d = id.slice(i + 1);
      const ex = (existing.wl && existing.wl[id]) ? existing.wl[id].rows : [];
      const m = new Map(); ex.forEach((r) => m.set(r[0], r));
      for (const w of gw[id]) {
        const old = m.get(w.wo); const r = E.wlToRow(w);
        if (old && !r[1] && old[1]) r[1] = old[1];   // keep known tracking if new report lacks it
        if (old && !r[6] && old[6]) r[6] = old[6];
        if (old && !r[7] && old[7]) r[7] = old[7];
        m.set(w.wo, r);
      }
      docs.push({ col: 'wl', id: id.replace(/[^A-Za-z0-9_\-.~:@+]/g, '-'), data: { wh, d, u: nowIso, rows: [...m.values()] } });
    }
    const gt = {};
    for (const t of parsed.t718) { const d = E.day(t.send) || 'nodate'; (gt[d] = gt[d] || []).push(t); }
    for (const d in gt) {
      const ex = (existing.trk && existing.trk[d]) ? existing.trk[d].rows : [];
      const m = new Map(); ex.forEach((r) => m.set(r[0], r));
      for (const t of gt[d]) m.set(t.tr, E.tToRow(t).concat([nowIso])); // 第 11 列记上传时间，读的时候同一单号取最新上传的
      docs.push({ col: 'trk', id: d, data: { d, u: nowIso, rows: [...m.values()] } });
    }
    for (const l of parsed.ledger) docs.push({ col: 'led', id: l.p + '_' + l.d, data: Object.assign({}, l, { u: nowIso }) });
    for (const r of (parsed.whout || [])) docs.push({ col: 'who', id: r.wh + '_' + r.d, data: { wh: r.wh, d: r.d, u: nowIso, sku: r.sku } });
    return { docs, cov };
  };

  // ---------- model ----------
  // state: {labels[], wl[], trk: [], ledger: [], notes:{}, spec:{}, cfg, cov:{P:[[a,b]...]}}
  E.buildModel = function (st) {
    const cfg = Object.assign({}, E.DEFAULT_CFG, st.cfg || {});
    const M = { cfg, labels: st.labels || [], wl: st.wl || [], trk: E.dedupT(st.trk || []), ledger: st.ledger || [], whOut: st.whout || [], notes: st.notes || {}, spec: st.spec || {}, cov: st.cov || {} };
    M.valid = M.labels.filter((l) => l.v);
    M.labByTr = new Map(); M.labsByBase = new Map(); M.voidByTr = new Map();
    for (const l of M.labels) for (const t of l.trs) { if (l.v) M.labByTr.set(t, l); else if (!M.labByTr.has(t)) M.voidByTr.set(t, l); }
    for (const l of M.valid) { const a = M.labsByBase.get(l.b) || []; a.push(l); M.labsByBase.set(l.b, a); }
    M.wlByTr = new Map(); M.wlByWO = new Map();
    for (const w of M.wl) { M.wlByWO.set(w.wo, w); for (const t of w.trs) M.wlByTr.set(t, w); }
    M.trkByTr = new Map(); for (const t of M.trk) M.trkByTr.set(t.tr, t);
    M.dates = uniq(M.valid.map((l) => l.d)).sort();
    M.whs = uniq(M.wl.map((w) => w.wh)).sort();
    // packages with per-package SKU and cost
    M.pkgs = [];
    for (const l of M.valid) for (const pk of E.labelPackages(M, l)) M.pkgs.push(pk);
    M.pkgByTr = new Map(); for (const pk of M.pkgs) if (pk.tr) M.pkgByTr.set(pk.tr, pk);
    return M;
  };

  E.labelPackages = function (M, l) {
    const nPk = Math.max(l.n || 1, l.trs.length, 1);
    let w = null; for (const t of l.trs) { if (M.wlByTr.has(t)) { w = M.wlByTr.get(t); break; } }
    if (!w) w = M.wlByWO.get(l.b) || null;
    const segsW = w ? E.skuSegs(w.skus) : [];
    const segsL = E.skuSegs(l.sku);
    let per = [];
    if (segsW.length) {
      if (segsW.length === nPk) per = segsW;
      else {
        const k = (l.wo.match(/-(\d+)$/) || [])[1];
        const allSame = segsW.every((s) => E.skuKey(s) === E.skuKey(segsW[0]));
        if (allSame) per = Array(nPk).fill(segsW[0]);
        else if (k && nPk === 1 && segsW[+k - 1]) per = [segsW[+k - 1]];
      }
    }
    if (!per.length && segsL.length) per = segsL.length === nPk ? segsL : Array(nPk).fill(segsL[0]);
    if (!per.length) per = Array(nPk).fill({ sku: '未知SKU', q: 1 });
    const cost = l.amt / nPk;
    const out = [];
    for (let i = 0; i < nPk; i++) {
      const seg = per[i] || per[0];
      out.push({ tr: l.trs[i] || null, wo: l.wo, b: l.b, p: l.p, d: l.d, dt: l.dt, ch: l.ch, sku: E.skuKey(seg), base: seg.sku, q: seg.q,
        cost, wt: l.wt == null ? null : l.wt / nPk, wh: w ? w.wh : '', wlCh: w ? w.ch : '', wlSt: w ? w.st : '', sd: w ? w.sd : '' });
    }
    return out;
  };

  // ---------- 1. 交单核对 ----------
  E.reconcile = function (M, D) {
    const cfg = M.cfg; const ign = new Set(cfg.ignoreCh || []);
    const labsD = M.valid.filter((l) => l.d === D);
    const labTrs = []; const shortTr = [];
    for (const l of labsD) { l.trs.forEach((t) => labTrs.push({ t, l })); if (l.trs.length < l.n) shortTr.push(l); }
    // WL batch D: packages matched to labels on D + unmatched WL orders placed on D
    const batch = new Map(); // tr -> wl
    const noTrOrders = [];
    for (const { t } of labTrs) { const w = M.wlByTr.get(t); if (w) batch.set(t, w); }
    for (const w of M.wl) {
      if (ign.has(w.ch)) continue;
      if (!w.trs.length) { if (E.day(w.ot) === D) noTrOrders.push(w); continue; }
      const labelled = w.trs.some((t) => M.labByTr.has(t));
      if (!labelled && E.day(w.ot) === D) w.trs.forEach((t) => batch.set(t, w));
    }
    const matched = [], labNoWL = [], wlNoLab = [];
    const child = [], cancelled = [];
    for (const { t, l } of labTrs) {
      const sameWO = M.wlByWO.get(l.b);
      if (sameWO && sameWO.st === '已取消') { cancelled.push({ t, l, w: sameWO, spec: M.spec[t] || null }); continue; }
      if (M.wlByTr.has(t)) { matched.push({ t, l, w: M.wlByTr.get(t) }); continue; }
      if (sameWO && sameWO.trs.length) {
        // 一单多件：WL 只记了主单号，按 SKU 件数判断这个子面单是否合理
        const nLabWO = (M.labsByBase.get(l.b) || []).reduce((s, x) => s + Math.max(x.trs.length, 1), 0);
        if (nLabWO <= E.wlPkgs(sameWO)) { child.push({ t, l, w: sameWO }); matched.push({ t, l, w: sameWO, child: true }); continue; }
      }
      const type = sameWO && sameWO.trs.length ? 'dup' : 'nowl';
      labNoWL.push({ t, l, type, w: sameWO || null, spec: M.spec[t] || null });
    }
    const voidShipped = [];
    for (const [t, w] of batch) if (!M.labByTr.has(t)) { const vd = M.voidByTr.get(t) || null; if (vd && w.st === '已发货') voidShipped.push({ t, w, l: vd }); else wlNoLab.push({ t, w, voided: vd }); }
    // over-printing: base WO with more valid label packages than WL packages
    const over = [];
    const bases = uniq(labsD.map((l) => l.b));
    for (const b of bases) {
      const labs = M.labsByBase.get(b) || []; const w = M.wlByWO.get(b);
      const nLab = labs.reduce((s, l) => s + l.n, 0);
      const plats = uniq(labs.map((l) => l.p));
      const nLabT = labs.reduce((s2, l) => s2 + Math.max(l.trs.length, 1), 0);
      if (w && w.st !== '已取消' && w.trs.length && nLabT > E.wlPkgs(w)) over.push({ b, labs, w, nLab: nLabT, nWl: E.wlPkgs(w), plats });
      else if (!w && plats.length > 1) over.push({ b, labs, w: null, nLab, nWl: null, plats });
    }
    // shipped vs not shipped within batch
    const notShipped = [];
    const seenWO = new Set();
    for (const [, w] of batch) { if (seenWO.has(w.wo)) continue; seenWO.add(w.wo); if (w.st && w.st !== '已发货') notShipped.push(w); }
    // per-platform counts & amount
    const byP = {};
    for (const l of labsD) { const o = byP[l.p] || (byP[l.p] = { pk: 0, amt: 0, labels: 0, matched: 0, nowl: 0 }); o.pk += l.trs.length || l.n; o.amt += l.amt; o.labels++; }
    for (const m of matched) byP[m.l.p].matched++;
    for (const m of labNoWL) byP[m.l.p].nowl++;
    // per-SKU units: labelled vs shipped (by batch)
    const sku = {};
    const addS = (k, f, q) => { const o = sku[k] || (sku[k] = { lab: 0, wl: 0, ship: 0 }); o[f] += q; };
    for (const l of labsD) for (const pk of E.labelPackages(M, l)) addS(pk.base, 'lab', pk.q);
    seenWO.clear();
    for (const [, w] of batch) { if (seenWO.has(w.wo)) continue; seenWO.add(w.wo); for (const s of E.skuSegs(w.skus)) { addS(s.sku, 'wl', s.q); if (w.st === '已发货') addS(s.sku, 'ship', s.q); } }
    // warehouses present for the batch
    const whCov = {}; for (const w of M.wl) { const d = E.day(w.ot); if (d === D || d === E.addDays(D, -1)) whCov[w.wh] = true; }
    const labPk = labTrs.length, wlPk = batch.size;
    const whMax = {}; for (const w of M.wl) { const d0 = E.day(w.ot); if (d0 && (!whMax[w.wh] || d0 > whMax[w.wh])) whMax[w.wh] = d0; }
    const wlMax = Object.values(whMax).sort()[0] || '';
    const wlStale = !wlMax || D > wlMax;
    const pend = labNoWL.filter((x) => !(x.spec && x.spec.ok));
    return { D, wlMax, wlStale, child, cancelled, voidShipped, labsD, labPk, wlPk, diff: labPk - wlPk, matched, labNoWL, pend, wlNoLab, over, notShipped, noTrOrders, shortTr, byP, sku, whCov,
      amt: E.r2(labsD.reduce((s, l) => s + l.amt, 0)) };
  };

  // ---------- 仓库口径：已交运（WL 提取时间的北京日期，不换算） vs 已发货（仓库发货记录当天页签的“出库”） ----------
  E.whFlow = function (M, from, to, wh) {
    const days = {};
    const D = (d) => days[d] || (days[d] = { d, sku: {}, jd: 0, ck: 0, hasRec: false, nOrd: 0 });
    const S = (o, name) => { const k = E.normSku(name); return o.sku[k] || (o.sku[k] = { name, jd: 0, ck: 0, noLab: 0, voidLab: 0, ords: [] }); };
    for (const w of M.wl) {
      if (wh && w.wh !== wh) continue;
      if (!w.pick || w.st === '已取消') continue;
      const jd = E.day(w.pick); if (jd < from || jd > to) continue;
      const segs = E.skuSegs(w.skus); if (!segs.length) continue;
      const hasLab = w.trs.some((t) => M.labByTr.has(t)) || (M.labsByBase.get(w.wo) || []).length > 0;
      const isVoid = !hasLab && w.trs.some((t) => M.voidByTr.has(t));
      D(jd).nOrd++;
      for (const g of segs) { const o = S(D(jd), g.sku); o.jd += g.q; D(jd).jd += g.q; if (!hasLab) o.noLab += g.q; if (isVoid) o.voidLab += g.q; o.ords.push(w); }
    }
    for (const r of M.whOut) {
      if (wh && r.wh !== wh) continue;
      if (r.d < from || r.d > to) continue;
      const day = D(r.d); day.hasRec = true;
      for (const [k, q] of Object.entries(r.sku || {})) { const o = S(day, k); o.ck = E.r2(o.ck + q); day.ck = E.r2(day.ck + q); }
    }
    for (const d in days) { const o = days[d]; o.short = 0; if (o.hasRec) for (const k in o.sku) { const x = o.sku[k]; if (x.jd > x.ck) o.short = E.r2(o.short + x.jd - x.ck); } }
    return { days };
  };

  // ---------- 2. 上线率 ----------
  E.online = function (M, opts) {
    const cfg = M.cfg; const now = opts && opts.now ? opts.now : null;
    const rows = [];
    for (const t of M.trk) {
      const pk = M.pkgByTr.get(t.tr); const w = M.wlByTr.get(t.tr); const l = M.labByTr.get(t.tr);
      const shipT = (w && w.sd) || t.send;
      const sd = E.day(shipT) || E.day(t.send);
      const on = E.ONLINE.has(t.st);
      const prob = E.PROBLEM.has(t.st) || E.PROBLEM.has(t.sub);
      let days = t.stay;
      if (days == null && shipT && now) days = (new Date(now.replace(' ', 'T') + 'Z') - new Date(shipT.replace(' ', 'T') + 'Z')) / 86400000;
      let lvl = 0;
      if (!on) lvl = days == null ? 1 : days >= cfg.on3 ? 3 : days >= cfg.on2 ? 2 : days >= cfg.on1 ? 1 : 0;
      const quiet = /^无需关注/.test(t.note || '');
      const vd = !l ? M.voidByTr.get(t.tr) || null : null;
      rows.push({ tr: t.tr, t, on, prob, quiet, days, lvl, sd, void: vd, p: l ? l.p : vd ? vd.p : E.platOfCh(w && w.ch), pGuess: !l && !!(w && E.platOfCh(w.ch) !== '?'), wo: (w && w.wo) || (l && l.wo) || '', wh: (w && w.wh) || '', sku: pk ? pk.sku : (w ? w.skus : (l ? l.sku : '')), ch: l ? l.ch : '', wlCh: w ? w.ch : '', note: M.notes[t.tr] || null });
    }
    const byDay = {};
    for (const r of rows) {
      const o = byDay[r.sd] || (byDay[r.sd] = { d: r.sd, tot: 0, on: 0, off: 0, prob: 0, byP: {}, byWh: {} });
      o.tot++; r.on ? o.on++ : o.off++; if (r.prob) o.prob++;
      const bp = o.byP[r.p] || (o.byP[r.p] = { tot: 0, off: 0 }); bp.tot++; if (!r.on) bp.off++;
      const bw = o.byWh[r.wh || '?'] || (o.byWh[r.wh || '?'] = { tot: 0, off: 0 }); bw.tot++; if (!r.on) bw.off++;
    }
    const days = Object.values(byDay).sort((a, b) => (a.d < b.d ? 1 : -1));
    // batch alerts: not online grouped by ship day × platform × warehouse
    const grp = {};
    for (const r of rows) {
      const k = r.sd + '|' + r.p + '|' + (r.wh || '?');
      const o = grp[k] || (grp[k] = { sd: r.sd, p: r.p, wh: r.wh || '?', tot: 0, off: [], skus: {} });
      o.tot++; if (!r.on) { o.off.push(r); const segs = E.skuSegs(r.sku); (segs.length ? segs : [{ sku: r.sku || '无SKU', q: 1 }]).forEach((g2) => { o.skus[g2.sku] = (o.skus[g2.sku] || 0) + g2.q; }); if (r.void) o.nVoid = (o.nVoid || 0) + 1; }
    }
    const batches = Object.values(grp).filter((g) => g.off.length && (g.off.length >= cfg.batchN || (g.off.length >= 3 && g.off.length / g.tot >= cfg.batchPct)))
      .map((g) => { const ds = g.off.map((r) => r.days || 0); const md = median(ds); return Object.assign(g, { maxDays: Math.max(...ds), medDays: md, lvl: md >= cfg.on2 ? 3 : md >= cfg.on1 ? 2 : 1 }); }).sort((a, b) => b.off.length - a.off.length);
    const off = rows.filter((r) => !r.on && !r.quiet).sort((a, b) => (b.days || 0) - (a.days || 0));
    const probs = rows.filter((r) => r.prob && !r.quiet);
    return { rows, days, off, probs, batches };
  };
  // labels (valid) whose trackings were never uploaded to 718
  E.missing718 = function (M, uptoDay, fromDay) {
    const out = [];
    for (const l of M.valid) {
      if (l.d > uptoDay || (fromDay && l.d < fromDay)) continue;
      for (const t of l.trs) if (!M.trkByTr.has(t)) out.push({ t, l, w: M.wlByTr.get(t) || null });
    }
    return out;
  };

  // ---------- 3/6. 均价 & 异常 ----------
  function mad(a, m) { return median(a.map((x) => Math.abs(x - m))); }
  E.baseline = function (M, sku, p, D) {
    const cfg = M.cfg; const from = E.addDays(D, -cfg.baseDays);
    const xs = M.pkgs.filter((k) => k.sku === sku && k.p === p && k.d < D && k.d >= from && k.cost > 0).map((k) => k.cost);
    const ws = M.pkgs.filter((k) => k.sku === sku && k.p === p && k.d < D && k.d >= from && k.wt).map((k) => k.wt);
    const ref = cfg.ref && cfg.ref[sku + '|' + p];
    if (xs.length < cfg.baseMin && !ref) return { n: xs.length, med: null };
    const med = ref || median(xs);
    return { n: xs.length, med, mad: xs.length ? mad(xs, median(xs)) : 0, mean: xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null, wmed: median(ws), ref: !!ref,
      p10: xs.length ? [...xs].sort((a, b) => a - b)[Math.floor(xs.length * 0.1)] : null, p90: xs.length ? [...xs].sort((a, b) => a - b)[Math.floor(xs.length * 0.9)] : null };
  };
  E.anomalies = function (M, D) {
    const cfg = M.cfg; const out = [];
    const today = M.pkgs.filter((k) => k.d === D && k.cost > 0);
    const g = {};
    for (const k of today) { const id = k.sku + '|' + k.p; (g[id] = g[id] || []).push(k); }
    for (const id in g) {
      const [sku, p] = id.split('|'); const ks = g[id];
      const b = E.baseline(M, sku, p, D); if (!b.med) continue;
      const hi = ks.filter((k) => k.cost > b.med * (1 + cfg.pkgPct) && k.cost - b.med > cfg.pkgAbs);
      const lo = ks.filter((k) => k.cost < b.med * (1 - cfg.lowPct));
      const avg = ks.reduce((s, k) => s + k.cost, 0) / ks.length;
      const dayHigh = ks.length >= 3 && avg > b.med * (1 + cfg.dayPct);
      const wts = ks.filter((k) => k.wt).map((k) => k.wt); const wmed = median(wts);
      const chs = {}; ks.forEach((k) => { chs[k.ch] = (chs[k.ch] || 0) + 1; });
      if (dayHigh || hi.length || lo.length) {
        let sev = 'yellow', why = [];
        const share = hi.length / ks.length;
        if (dayHigh && share >= 0.5) { sev = 'red'; why.push('当天 ' + Math.round(share * 100) + '% 的包裹都高于历史中位价，同时整体上涨，像是渠道方价格表/燃油附加费/分区配置被改动，或选错了渠道产品'); }
        else if (dayHigh) { sev = 'orange'; why.push('当天均价高于历史中位价 ' + Math.round((avg / b.med - 1) * 100) + '%'); }
        if (hi.length && share < 0.5) why.push(hi.length + ' 个包裹单价异常偏高，多为偏远/住宅/超长超重附加费或单个订单重量尺寸录入错误');
        if (wmed && b.wmed && Math.abs(wmed / b.wmed - 1) > 0.1) why.push('预报重量中位数 ' + E.r2(wmed) + ' 与历史 ' + E.r2(b.wmed) + ' 不一致，检查渠道方的重量/尺寸配置');
        if (lo.length) { why.push(lo.length + ' 个包裹单价异常偏低，可能少报了重量或尺寸，之后有被反弹补扣的风险'); if (sev === 'yellow' && lo.length >= 3) sev = 'orange'; }
        out.push({ sev, sku, p, n: ks.length, avg, med: b.med, base: b, hi, lo, dayHigh, chs, wmed, why });
      }
    }
    const rank = { red: 0, orange: 1, yellow: 2 };
    return out.sort((a, b) => rank[a.sev] - rank[b.sev] || b.n - a.n);
  };
  // SKU × platform average over a date range
  E.skuAvg = function (M, from, to) {
    const t = {};
    for (const k of M.pkgs) {
      if (k.d < from || k.d > to) continue;
      const o = t[k.sku] || (t[k.sku] = { sku: k.sku, n: 0, amt: 0, byP: {} });
      o.n++; o.amt += k.cost;
      const bp = o.byP[k.p] || (o.byP[k.p] = { n: 0, amt: 0 }); bp.n++; bp.amt += k.cost;
    }
    return Object.values(t).sort((a, b) => b.n - a.n);
  };
  E.skuTrend = function (M, sku, from, to, by) {
    const t = {};
    for (const k of M.pkgs) {
      if (k.sku !== sku || k.d < from || k.d > to) continue;
      const key = by === 'week' ? E.weekStartOf(k.d, M.cfg.weekStart) : k.d;
      const o = t[key] || (t[key] = { key, n: 0, amt: 0, byP: {} }); o.n++; o.amt += k.cost;
      const bp = o.byP[k.p] || (o.byP[k.p] = { n: 0, amt: 0 }); bp.n++; bp.amt += k.cost;
    }
    return Object.values(t).sort((a, b) => (a.key < b.key ? -1 : 1));
  };

  // ---------- 4. 余额核对 ----------
  E.covered = function (M, p, d) { return (M.cov[p] || []).some((r) => d >= r[0] && d <= r[1]); };
  E.sysAmt = function (M, p, d) { return E.r2(M.valid.filter((l) => l.p === p && l.d === d).reduce((s, l) => s + l.amt, 0)); };
  E.ledgerRows = function (M, p) {
    const es = M.ledger.filter((e) => e.p === p).sort((a, b) => (a.d < b.d ? -1 : 1));
    const out = []; let prev = null;
    for (const e of es) {
      const cov = E.covered(M, p, e.d);
      const sys = cov ? E.sysAmt(M, p, e.d) : null;
      const used = sys != null ? sys : (e.prepay || 0);
      const open = prev && prev.close != null ? prev.close : null;
      const calc = open == null ? null : E.r2(open + (e.credit || 0) - used - (e.offline || 0) + (e.rebound || 0) + (e.refund || 0));
      const diff = calc == null || e.close == null ? null : E.r2(e.close - calc);
      const r = { e, p, d: e.d, open, sys, used, cov, calc, diff, prevD: prev ? prev.d : null };
      r.ok = diff == null ? null : Math.abs(diff) <= M.cfg.ledTol;
      r.prepayGap = sys != null && e.prepay != null && e.prepay !== 0 ? E.r2(e.prepay - sys) : null;
      out.push(r); prev = e;
    }
    for (let i = 0; i < out.length; i++) { out[i]._prev = out[i - 1] || null; out[i]._next = out[i + 1] || null; out[i]._later = out.slice(i + 1, i + 15); }
    for (const r of out) { r.why = E.ledgerWhy(M, r); r.explained = r.ok === false && r.why.some((w) => /作废退款|两天合起来是平的|就对平了/.test(w)); }
    for (const r of out) { delete r._prev; delete r._next; delete r._later; }
    return out;
  };
  E.ledgerWhy = function (M, r) {
    const why = []; const e = r.e;
    if (r.open == null) { why.push('没有上一条期末记录，无法推算期初'); return why; }
    if (r.diff == null) return why;
    const tol = M.cfg.ledTol;
    if (r.prepayGap != null && Math.abs(r.prepayGap) > tol) {
      why.push('手填预扣费总额比系统报告' + (r.prepayGap > 0 ? '多 ' : '少 ') + Math.abs(r.prepayGap).toFixed(2) + '：' + (r.prepayGap > 0 ? '报告可能导出得早，漏了最后几单；或有面单之后被取消/退款，从报告中消失' : '手填漏算了部分面单，或报告包含了被取消但仍计费的面单'));
    }
    if (Math.abs(r.diff) <= tol) return why;
    const d = r.diff;
    if (!e.credit && e.slip && Math.abs(d - e.slip) <= Math.max(tol, e.slip * 0.01)) why.push('当天充值只填在“水单金额”（' + e.slip + '），“新增额度/充值”是空的：把充值金额补进新增额度就对平了');
    if (e.credit && Math.abs(d + e.credit) <= Math.max(tol, e.credit * 0.01)) why.push('登记了新增额度 ' + e.credit + '，但平台余额没有增加：确认这笔充值是否真的到账，或者是不是重复登记');
    if (r._next && r._next.diff != null && Math.abs(r._next.diff + d) <= Math.max(1, Math.abs(d) * 0.02)) why.push('第二天（' + r._next.d + '）出现方向相反、金额相同的差额，多半是这天余额抄早了或抄错了，两天合起来是平的');
    if (d < 0 && r._later) {
      const hit = r._later.find((x) => x.d > r.d && x.d <= E.addDays(r.d, 21) && [x.e.refund, x.e.rebound].some((v) => v && Math.abs(v + d) <= tol));
      if (hit) why.push(hit.d + ' 有一笔相同金额（' + (-d).toFixed(2) + '）的退款/反弹：这张面单当天扣了钱，之后作废退款，平台报告里已经删掉了，所以报告金额比实扣少');
    }
    if (r._prev && r._prev.diff != null && Math.abs(r._prev.diff + d) <= Math.max(1, Math.abs(d) * 0.02)) why.push('和前一天（' + r._prev.d + '）的差额正好抵消，两天合起来是平的');
    if (e.slip && e.credit && Math.abs(Math.abs(d) - Math.abs(e.slip - e.credit)) <= tol) why.push('差额正好等于水单金额与新增额度之差（' + E.r2(e.slip - e.credit) + '），确认实际到账/入账的充值金额');
    if (d < 0) {
      // look for a single label amount that explains the gap
      const hit = M.valid.find((l) => l.p === r.p && Math.abs(l.amt + d) <= tol && l.d >= E.addDays(r.d, -3) && l.d <= r.d);
      if (hit) why.push('差额与面单 ' + hit.wo + '（' + hit.d + '，' + hit.amt.toFixed(2) + '）金额一致：可能这张面单被重复扣费，或扣在了这一天');
      if (-d < 5) why.push('平台多扣了 ' + (-d).toFixed(2) + '：多为反弹/附加费（地址更正、偏远、超重）还没录入“反弹金额”');
      else why.push('平台多扣了 ' + (-d).toFixed(2) + '：有没录入的线下打单、反弹补扣，或上传的报告不完整');
    } else {
      why.push('平台余额比推算多 ' + d.toFixed(2) + '：可能有退款/取消面单返还、充值多到账还没录入，或系统报告多算了已取消的面单');

    return why;
  };

  // ---------- 5. 区间/周汇总 ----------
  E.summary = function (M, from, to, by) {
    const haz = new Set(M.cfg.hazmat);
    const buckets = {};
    const keyOf = (d) => by === 'day' ? d : by === 'all' ? from : E.weekStartOf(d, M.cfg.weekStart);
    const B = (k) => buckets[k] || (buckets[k] = { key: k, byP: {}, amt: 0, pk: 0, hz: 0, hzPk: 0, credit: 0, creditByP: {} });
    for (const k of M.pkgs) {
      if (k.d < from || k.d > to) continue;
      const b = B(keyOf(k.d)); const bp = b.byP[k.p] || (b.byP[k.p] = { amt: 0, pk: 0, hz: 0, hzPk: 0, hzSku: {} });
      b.amt += k.cost; b.pk++; bp.amt += k.cost; bp.pk++;
      if (haz.has(k.base)) { b.hz += k.cost; b.hzPk++; bp.hz += k.cost; bp.hzPk++; const hs = bp.hzSku[k.base] || (bp.hzSku[k.base] = { amt: 0, pk: 0 }); hs.amt += k.cost; hs.pk++; }
    }
    for (const e of M.ledger) { if (e.d < from || e.d > to || !e.credit) continue; const b = B(keyOf(e.d)); b.credit += e.credit; b.creditByP[e.p] = (b.creditByP[e.p] || 0) + e.credit; }
    return Object.values(buckets).sort((a, b) => (a.key < b.key ? 1 : -1));
  };

  // ---------- alerts for a day ----------
  E.alerts = function (M, D, opts) {
    const A = []; const add = (sev, area, title, detail, tab) => A.push({ sev, area, title, detail, tab });
    const rc = E.reconcile(M, D);
    if (rc.labsD.length && rc.wlStale) add('yellow', '交单核对', 'Wavelink 报告还没覆盖 ' + D, '已上传的 Wavelink 订单最新到 ' + (rc.wlMax || '—') + '，上传当天的 Wavelink 待发货报告后才能核对 ' + rc.labPk + ' 个面单', 'upload');
    if (rc.labsD.length && !rc.wlStale) {
      const dups = rc.labNoWL.filter((x) => x.type === 'dup');
      if (dups.length) add('red', '交单核对', dups.length + ' 张面单疑似重复打单', '同一个 Wavelink 订单已有其他面单号，这些面单号不在 Wavelink 里：' + dups.slice(0, 5).map((x) => x.l.wo + ' ' + x.t).join('；'), 'recon');
      if (rc.cancelled.length) add('red', '交单核对', rc.cancelled.length + ' 张面单对应的 Wavelink 订单已取消', '订单取消了但面单还有效，要作废并申请退款：' + rc.cancelled.slice(0, 5).map((x) => E.PNAME[x.l.p] + ' ' + x.l.wo + ' ' + x.t + ' $' + x.l.amt.toFixed(2)).join('；'), 'recon');
      if (false && rc.voidShipped.length) add('red', '交单核对', rc.voidShipped.length + ' 个已作废的面单被仓库用来发货', '平台上面单已取消/失败，但 Wavelink 显示已用这个单号发货，可能被渠道补扣或者包裹没有物流：' + rc.voidShipped.slice(0, 5).map((x) => E.PNAME[x.l.p] + ' ' + x.w.wo + ' ' + x.t).join('；'), 'recon');
      if (rc.over.length) add('red', '交单核对', rc.over.length + ' 个订单打单件数多于 Wavelink 包裹数', rc.over.slice(0, 5).map((o) => o.b + '（打单 ' + o.nLab + ' / WL ' + (o.nWl == null ? '无' : o.nWl) + '，' + o.plats.map((p) => E.PNAME[p]).join('+') + '）').join('；'), 'recon');
      const pend = rc.pend.filter((x) => x.type === 'nowl');
      if (pend.length) add('orange', '交单核对', pend.length + ' 个面单号在 Wavelink 里找不到，待运营确认', '可能是线下单、TZ 仓报告未上传或多打。按平台：' + Object.entries(pend.reduce((m, x) => (m[E.PNAME[x.l.p]] = (m[E.PNAME[x.l.p]] || 0) + 1, m), {})).map(([k, v]) => k + ' ' + v).join('，'), 'recon');
      if (rc.wlNoLab.length) add('orange', '交单核对', rc.wlNoLab.length + ' 个 Wavelink 包裹找不到打单记录', '可能漏打，或该平台报告没上传/不完整。示例：' + rc.wlNoLab.slice(0, 4).map((x) => x.w.wo + '（' + x.w.ch + '）').join('；'), 'recon');
      if (rc.noTrOrders.length) add('orange', '交单核对', rc.noTrOrders.length + ' 个 Wavelink 订单没有面单号', '下单日期为当天但没有派送单号，确认是否漏打', 'recon');
      if (rc.notShipped.length && opts && opts.today && opts.today > D) add('yellow', '交单核对', rc.notShipped.length + ' 个已打单订单仓库还没发货', '面单已扣费但仓库状态不是“已发货”，如订单取消需要作废面单申请退款', 'recon');
    }
    { const from = E.addDays(D, -21); const vs = [];
      for (const w of M.wl) { if (w.st !== '已发货' || !w.sd || E.day(w.sd) < from || E.day(w.sd) > E.addDays(D, 1)) continue; for (const t of w.trs) { if (!M.labByTr.has(t) && M.voidByTr.has(t)) vs.push({ t, w, l: M.voidByTr.get(t) }); } }
      if (vs.length) { const g = {}; vs.forEach((x) => { const k = E.day(x.w.sd) + ' 发货 · ' + x.w.wh + ' · ' + E.PNAME[x.l.p] + '（' + x.l.st + '）'; g[k] = (g[k] || 0) + 1; });
        add('red', '交单核对', '近 3 周有 ' + vs.length + ' 个包裹用已作废的面单发了货', '平台上这些面单已取消/失败，也没有重新打有效面单，仓库却用它们发货：包裹不会有物流，平台也可能补扣。' + Object.entries(g).map(([k, v]) => k + ' ' + v + ' 个').join('；') + '。示例：' + vs.slice(0, 3).map((x) => x.w.wo + ' ' + x.t).join('；'), 'online'); } }
    for (const wh0 of [...new Set(M.whOut.map((r) => r.wh))]) {
      const f = E.whFlow(M, E.addDays(D, -7), D, wh0);
      const bad = Object.values(f.days).filter((o) => o.hasRec && o.short > 0).sort((a, b) => (a.d < b.d ? 1 : -1));
      if (bad.length) add('orange', '交单核对', wh0 + ' 有已交运但仓库没发走的件', '按 Wavelink 提取时间（北京日期）对仓库发货记录：' + bad.map((o) => o.d + ' 差 ' + o.short + ' 件（' + Object.values(o.sku).filter((x) => x.jd > x.ck).slice(0, 4).map((x) => x.name + ' ' + E.r2(x.jd - x.ck)).join('，') + '）').join('；'), 'recon');
    }
    if (opts && opts.on) {
      const on = opts.on;
      for (const b of on.batches) add(b.lvl === 3 ? 'red' : b.lvl === 2 ? 'orange' : 'yellow', '上线率', '批量未上线：' + b.sd + ' ' + E.PNAME[b.p] + ' / ' + b.wh + ' 共 ' + b.off.length + ' 个', '中位 ' + E.r2(b.medDays) + ' 天 / 最长 ' + E.r2(b.maxDays) + ' 天，占该批 ' + Math.round(b.off.length / b.tot * 100) + '%。' + (b.nVoid ? '其中 ' + b.nVoid + ' 个用的是平台上已作废的面单！' : '') + 'SKU（件数）：' + Object.entries(b.skus).map(([k, v]) => k + '×' + v).join('，'), 'online');
      const sev3 = on.off.filter((r) => r.lvl === 3 && !(r.note && r.note.solved));
      const sev2 = on.off.filter((r) => r.lvl === 2 && !(r.note && r.note.solved));
      if (sev3.length) add('red', '上线率', sev3.length + ' 个包裹超过 ' + M.cfg.on3 + ' 天未上线', sev3.slice(0, 6).map((r) => r.tr + ' ' + r.sku + ' ' + (r.wh || '?') + ' ' + E.PNAME[r.p]).join('；'), 'online');
      if (sev2.length) add('orange', '上线率', sev2.length + ' 个包裹 ' + M.cfg.on2 + ' 天以上未上线', sev2.slice(0, 6).map((r) => r.tr + ' ' + r.sku).join('；'), 'online');
      const pr = on.probs.filter((r) => !(r.note && r.note.solved));
      if (pr.length) add('yellow', '上线率', pr.length + ' 个已上线包裹有异常（破损/退回/投递失败）', pr.slice(0, 5).map((r) => r.tr + ' ' + (r.t.sub || r.t.st)).join('；'), 'online');
    }
    if (opts && opts.miss718 && opts.miss718.length) add('yellow', '上线率', opts.miss718.length + ' 个面单号还没导入 718', '这些面单号不在任何一份 718 报告里，上线情况无法追踪', 'online');
    for (const p of E.PLATS) {
      const rows = E.ledgerRows(M, p); const r = rows.find((x) => x.d === D);
      if (!r) { if (E.sysAmt(M, p, D) > 0) add('yellow', '余额核对', E.PNAME[p] + ' 当天有打单但还没录入余额', '系统打单金额 ' + E.sysAmt(M, p, D).toFixed(2), 'ledger'); continue; }
      if (r.ok === false) add(r.explained ? 'yellow' : Math.abs(r.diff) >= 20 ? 'red' : 'orange', '余额核对', E.PNAME[p] + ' 期末对不上：差 ' + r.diff.toFixed(2) + (r.explained ? '（已找到原因）' : ''), r.why.join('；'), 'ledger');
      else if (r.prepayGap != null && Math.abs(r.prepayGap) > M.cfg.ledTol) add('yellow', '余额核对', E.PNAME[p] + ' 手填预扣费与报告差 ' + r.prepayGap.toFixed(2), r.why.join('；'), 'ledger');
    }
    for (const a of E.anomalies(M, D)) add(a.sev, '面单价格', E.PNAME[a.p] + ' · ' + a.sku + ' 均价 ' + a.avg.toFixed(2) + '（历史中位 ' + a.med.toFixed(2) + '）', a.why.join('；'), 'price');
    const rank = { red: 0, orange: 1, yellow: 2 };
    return { list: A.sort((a, b) => rank[a.sev] - rank[b.sev]), rc };
  };

  root.Engine = E;
  if (typeof module !== 'undefined') module.exports = E;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function(){
'use strict';
const E = window.Engine;
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (x) => x == null || isNaN(x) ? '—' : (x < 0 ? '-' : '') + '$' + Math.abs(x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const n2 = (x) => x == null || isNaN(x) ? '—' : Number(x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = (x) => x == null || isNaN(x) ? '—' : (x * 100).toFixed(1) + '%';
const PN = E.PNAME;
const PCOL = { TS: 'var(--s1)', RK: 'var(--s2)', HC: 'var(--s3)', HYE: 'var(--s4)', WT: 'var(--s5)' };
const PORDER = ['TS', 'RK', 'HC', 'HYE', 'WT'];
const SEVL = { red: '严重', orange: '预警', yellow: '关注' };
const LVL = { 3: ['red', '严重'], 2: ['orange', '预警'], 1: ['yellow', '关注'], 0: ['grey', '观察'] };
const today = (() => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); })();
const nowStr = () => { const t = new Date(); return today + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ':00'; };

// ---------------- store ----------------
const S = { db: null, dl: null, mode: 'loading', cache: { lab: {}, wl: {}, trk: {}, led: {}, who: {}, note: {}, spec: {}, meta: {}, upl: {} } };
const COLS = ['lab', 'wl', 'trk', 'led', 'who'];
let READY = null; // 数据库读取完成前的保存要等它，否则会被读取结果覆盖
async function initStore() {
  try { S.db = await window.claude.use('db'); } catch (e) { S.db = null; S.dbErr = e; }
  try { S.dl = await window.claude.use('downloads'); } catch (e) { S.dl = null; }
  if (!S.db) { S.mode = 'mem'; setStatus('warn', (S.dbErr && S.dbErr.message) || '连不上多维表格'); return; }
  window.OFFLINE.onChange(() => { const el = $('#stStatus'); el.innerHTML = '<span class="dot warn"></span><span>同事刚更新了数据</span> <button class="btn sm" id="stRe">刷新</button>'; $('#stRe').onclick = async () => { setStatus('', '正在刷新…'); await window.OFFLINE.reload(); await loadAll(); rebuild(); render(); toast('已刷新'); }; });
  S.mode = 'db';
  await loadAll();
}
async function loadAll() {
  setStatus('', '正在读取数据…');
  const cfgSnap = await S.db.doc('meta/cfg').get().catch(() => null);
  if (cfgSnap && cfgSnap.exists) S.cache.meta.cfg = cfgSnap.data();
  const covSnap = await S.db.doc('meta/cov').get().catch(() => null);
  if (covSnap && covSnap.exists) S.cache.meta.cov = covSnap.data();
  const days = (S.cache.meta.cfg && S.cache.meta.cfg.loadDays) || 150;
  const from = E.addDays(today, -days);
  let capped = false;
  for (const c of COLS) {
    const snap = await S.db.collection(c).where('d', '>=', from).limit(1000).get();
    S.cache[c] = {}; snap.docs.forEach((d) => { S.cache[c][d.id] = d.data(); });
    if (snap.size >= 1000) capped = true;
  }
  for (const c of ['note', 'spec']) {
    const snap = await S.db.collection(c).limit(1000).get();
    S.cache[c] = {}; snap.docs.forEach((d) => { S.cache[c][d.id] = d.data(); });
  }
  const up = await S.db.collection('upl').where('d', '>=', E.addDays(today, -30)).limit(100).get();
  S.cache.upl = {}; up.docs.forEach((d) => { S.cache.upl[d.id] = d.data(); });

  if (size > 250000) throw new Error(col + '/' + id + ' 太大（' + Math.round(size / 1024) + 'KB）');
  try { await S.db.doc(col + '/' + id).set(data); }
  catch (e) {
    if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 800 + Math.random() * 800)); await S.db.doc(col + '/' + id).set(data); }

}

async function readFiles(list) {
  if (!list.length) return;
  $('#pend').innerHTML = '<div class="muted">正在读取 ' + list.length + ' 个文件…</div>';
  if (list.some((f) => !/\.csv$/i.test(f.name))) { try { await window.loadXLSX(); } catch (e) { $('#pend').innerHTML = '<div class="banner warn">' + esc(e.message) + '</div>'; return; } }
  const files = [];
  for (const f of list) {
    try {
      const buf = await f.arrayBuffer(); let sheets;
      if (/\.csv$/i.test(f.name)) {
        let text = new TextDecoder('utf-8').decode(buf);
        if ((text.match(/\ufffd/g) || []).length > 5) { try { text = new TextDecoder('gbk').decode(buf); } catch (e) {} }
        sheets = [{ name: f.name, rows: E.parseCSV(text) }];
      } else {
        const wb = XLSX.read(buf, { type: 'array', cellDates: false, dense: false });
        sheets = wb.SheetNames.map((n) => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }) }));
      }
      files.push({ name: f.name, sheets, det: E.detect(sheets, f.name) });
    } catch (e) { files.push({ name: f.name, sheets: [], det: { kind: 'UNKNOWN', label: '读取失败：' + (e.message || e) } }); }
  }
  const parsed = E.parseBatch(files);
  // tag labels with source file for preview
  for (const f of files) { if (['HYE', 'TS_SUM', 'WT', 'RK', 'HC_SUM'].includes(f.det.kind)) { const map = { HYE: 'HYE', TS_SUM: 'TS', WT: 'WT', RK: 'RK', HC_SUM: 'HC' }; parsed.labels.filter((l) => l.p === map[f.det.kind]).forEach((l) => { l._f = f.name; }); } }
  PENDING = { files, parsed };
  $('#pend').innerHTML = pendHtml(); bindPend();
}
async function savePending() {
  const P = PENDING.parsed; const btn = $('#doSave'); btn.disabled = true;
  const msg = $('#saveMsg'), prog = $('#prog'); prog.hidden = false;
  try {
    const at = nowStr();
    // fetch existing docs we are about to merge into
    const ids = { lab: new Set(), wl: new Set(), trk: new Set() };
    P.labels.forEach((l) => l.d && ids.lab.add(l.p + '_' + l.d));
    P.wl.forEach((w) => { const d = E.day(w.ot) || E.day(w.sd); if (d) ids.wl.add((w.wh + '_' + d).replace(/[^A-Za-z0-9_\-.~:@+]/g, '-')); });
    P.t718.forEach((t) => ids.trk.add(E.day(t.send) || 'nodate'));
    const existing = { lab: {}, wl: {}, trk: {} };
    msg.textContent = '核对已有数据…';
    for (const c of ['lab', 'wl', 'trk']) for (const id of ids[c]) { const d = await getDoc(c, id); if (d) existing[c][id] = d; }
    const { docs, cov } = E.buildDocs(P, existing, at);
    // 718 上线后会改“发货时间”，同一个单号会落到另一天的存档。把这次上传的单号从其他天的存档里删掉，避免旧状态残留
    if (P.t718.length) {
      const newDay = new Map(); P.t718.forEach((t) => newDay.set(String(t.tr).trim(), E.day(t.send) || 'nodate'));
      const keep = (id) => (r) => { const k = String(r[0]).trim(); return !newDay.has(k) || newDay.get(k) === id; };
      for (const d of docs) if (d.col === 'trk') d.data = Object.assign({}, d.data, { rows: d.data.rows.filter(keep(d.id)) });
      const inDocs = new Set(docs.filter((d) => d.col === 'trk').map((d) => d.id));
      let cleaned = 0;
      for (const id in S.cache.trk) {

// 输入时实时算期末和核对（口径同 E.ledgerRows）
function ledLive(p) {
  const row = document.querySelector('tr[data-lrow="' + p + '"]'); const lc = $('#lc-' + p), ls = $('#ls-' + p); if (!row || !lc || !ls) return;
  const g = (k) => { const el = document.querySelector('[data-l="' + p + '|' + k + '"]'); return el ? ledNum(el.value) : null; };
  const open = row.dataset.open === '' ? null : +row.dataset.open; const sys = row.dataset.sys === '' ? null : +row.dataset.sys;
  const tag = ledDirty(p) ? ' <span class="muted small">未保存</span>' : '';
  if (open == null) { lc.innerHTML = '<span class="blank">—</span>'; ls.innerHTML = chip('grey', '缺期初') + tag; return; }
  const used = sys != null ? sys : (g('prepay') || 0);
  const calc = E.r2(open + (g('credit') || 0) - used - Math.abs(g('offline') || 0) + (g('rebound') || 0) + (g('refund') || 0));
  lc.textContent = n2(calc);
  const close = g('close');
  if (close == null) { ls.innerHTML = chip('grey', '待填交单后余额') + tag; return; }
  const diff = E.r2(close - calc);
  ls.innerHTML = (Math.abs(diff) <= M.cfg.ledTol ? chip('green', '对平') : chip(Math.abs(diff) >= 20 ? 'red' : 'orange', '差 ' + n2(diff))) + tag;
}
AFTER.ledger = function () {
  document.querySelectorAll('[data-lp]').forEach((b) => b.onclick = () => { LP = b.dataset.lp; render(); });
  document.querySelectorAll('[data-l]').forEach((el) => el.addEventListener('input', () => { const [p, k] = el.dataset.l.split('|'); LDRAFT.v[D + '|' + p + '|' + k] = el.value; saveDraft(); ledLive(p); }));
  E.PLATS.forEach((p) => { if (ledDirty(p)) ledLive(p); });
  const s = $('#ledSave'); if (s) s.onclick = async () => {
    s.disabled = true;
    try {
      const t = new Date(); const time = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
      let n = 0;
      for (const p of E.PLATS) {
        const v = {}; let any = false;
        LF.forEach(([k]) => { const el = document.querySelector('[data-l="' + p + '|' + k + '"]'); v[k] = el ? ledNum(el.value) : null; if (v[k] != null) any = true; });
        const id = p + '_' + D; const old = S.cache.led[id];

        const doc = { p, d: D, time: (old && old.time) || time, credit: v.credit || 0, slip: v.slip || 0, offline: Math.abs(v.offline || 0), rebound: v.rebound || 0, refund: v.refund || 0, prepay: v.prepay, close: v.close, note: '', src: 'manual', u: nowStr() };
        await put('led', id, doc); n++;
      }
      Object.keys(LDRAFT.v).forEach((k) => { if (k.startsWith(D + '|')) delete LDRAFT.v[k]; }); saveDraft();
      rebuild(); render(); toast(n ? '已保存 ' + D + ' 的 ' + n + ' 个平台' : '没有填写任何数值，没有保存'); if (n) syncSheets('ledger');
    } catch (e) { s.disabled = false; toast('保存失败：' + (e.message || e) + '（已填的数还在，可以再点一次）'); }
  };
};

  $('#expAll').onclick = async () => {
    try { await window.loadXLSX(); } catch (e) { toast(e.message); return; }
    const wb = XLSX.utils.book_new();
    const add = (name, head, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head].concat(rows)), name);
    add('打单记录', ['平台', '平台订单号', '面单号', '打单时间', '预报金额', '包裹数', '平台备注SKU', '渠道', '重量', '有效', '状态'], M.labels.map((l) => [PN[l.p], l.wo, l.trs.join(','), l.dt, l.amt, l.n, l.sku, l.ch, l.wt, l.v ? '是' : '否', l.st]));
    add('包裹明细', ['平台', '打单日', '面单号', 'WO', 'SKU', '单包裹金额', '仓库', 'WL渠道'], M.pkgs.map((k) => [PN[k.p], k.d, k.tr, k.wo, k.sku, E.r2(k.cost), k.wh, k.wlCh]));
    add('Wavelink', ['仓库', 'WO', '派送单号', 'SKU', '物流渠道', '状态', '下单时间', '发货时间'], M.wl.map((w) => [w.wh, w.wo, w.trs.join(','), w.skus, w.ch, w.st, w.ot, w.sd]));
    add('718', ['面单号', '发货时间', '物流商', '状态', '子状态', '最近轨迹', '上网时间', '签收时间', '停留天数', '备注'], M.trk.map((t) => [t.tr, t.send, t.carrier, t.st, t.sub, t.last, t.on, t.sign, t.stay, t.note]));
    add('仓库发货记录', ['仓库', '日期', 'SKU', '出库'], M.whOut.flatMap((r) => Object.entries(r.sku).map(([k, q]) => [r.wh, r.d, k, q])));
    add('余额台账', ['平台', '日期', '时间', '新增额度', '水单', '线下', '反弹', '退款', '手填预扣费', '期末手抄', '来源'], M.ledger.map((e) => [PN[e.p], e.d, e.time, e.credit, e.slip, e.offline, e.rebound, e.refund, e.prepay, e.close, e.src]));
    add('跟进备注', ['面单号', '下一步', '已解决', '备注', '时间'], Object.entries(S.cache.note).map(([t, n]) => [t, n.action, n.solved ? '是' : '', n.remark, n.at]));
    add('特殊情况', ['面单号', '打单日', '平台', 'WO', '原因', '说明', '确认时间'], Object.entries(S.cache.spec).map(([t, s]) => [t, s.d, PN[s.p], s.wo, s.reason, s.remark, s.at]));
    const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    saveFile('打单核对源数据_' + today + '.xlsx', new Blob([out]));
  };
  $('#delAsk').onclick = () => {
    const id = $('#delId').value; if (!id) return;
    $('#delConfirm').innerHTML = '<span class="small">确定删除 ' + esc(id) + '？</span> <button class="btn sm" id="delYes">确定</button>';
    $('#delYes').onclick = async () => { await del('lab', id); rebuild(); render(); toast('已删除 ' + id); };
  };
};

// ---------------- 写入给人看的表 ----------------
let SYNC = { running: false, again: false, last: null, err: null };
const STAGE = { 3: '严重', 2: '预警', 1: '关注', 0: '观察' };
const SHEETS = {
  off: { name: '未上线明细', fields: [['面单号', 'T'], ['发货日', 'T'], ['平台', 'T'], ['仓', 'T'], ['WO', 'T'], ['渠道', 'T'], ['SKU', 'T'], ['承运商', 'T'], ['718状态', 'T'], ['停留天数', 'N'], ['阶段', 'T'], ['作废面单', 'T'], ['查轨迹', 'T'], ['负责人', 'T'], ['处理结果', 'T']],
    own: ['发货日', '平台', '仓', 'WO', '渠道', 'SKU', '承运商', '718状态', '停留天数', '阶段', '作废面单', '查轨迹'] },
  onl: { name: '上线率汇总', fields: [['编号', 'T'], ['发货日', 'T'], ['平台', 'T'], ['仓', 'T'], ['总数', 'N'], ['已上线', 'N'], ['未上线', 'N'], ['上线率%', 'N'], ['未上线明细', 'L', '未上线明细']],
    own: ['发货日', '平台', '仓', '总数', '已上线', '未上线', '上线率%', '未上线明细'], stale: () => 'delete' },
  day: { name: '每日打单汇总', fields: [['编号', 'T'], ['日期', 'T'], ['平台', 'T'], ['仓', 'T'], ['包裹数', 'N'], ['金额', 'N'], ['危品包裹', 'N'], ['危品金额', 'N']],
    own: ['日期', '平台', '仓', '包裹数', '金额', '危品包裹', '危品金额'], stale: () => 'delete' },
  sku: { name: '交单核对SKU', fields: [['编号', 'T'], ['日期', 'T'], ['仓', 'T'], ['SKU', 'T'], ['已交运', 'N'], ['已发货', 'N'], ['差值', 'N'], ['说明', 'T']],
    own: ['日期', '仓', 'SKU', '已交运', '已发货', '差值', '说明'], stale: () => 'delete' },
  pr: { name: '面单均价', fields: [['编号', 'T'], ['周', 'T'], ['SKU', 'T'], ['平台', 'T'], ['包裹数', 'N'], ['金额', 'N'], ['均价', 'N']],
    own: ['周', 'SKU', '平台', '包裹数', '金额', '均价'], stale: () => 'delete' },
  exc: { name: '异常单', fields: [['编号', 'T'], ['发现日', 'T'], ['类型', 'T'], ['平台', 'T'], ['仓', 'T'], ['WO', 'T'], ['单号', 'T'], ['SKU', 'T'], ['说明', 'T'], ['负责人', 'T'], ['状态', 'T'], ['处理备注', 'T']],
    own: ['发现日', '类型', '平台', '仓', 'WO', '单号', 'SKU', '说明'], onNew: { '状态': '待处理' } }
};
function sheetRows() {
  const out = {}; const f14 = E.addDays(today, -14), f30 = E.addDays(today, -30), f60 = E.addDays(today, -60);
  const hz = (s) => M.cfg.hazmat.includes(String(s).replace(/\*\d+$/, ''));
  const pn = (p) => PN[p] || p || '未匹配';
  // 未上线明细
  const offRows = ON.rows.filter((r) => !r.on && !r.quiet && r.sd && r.sd >= f30);
  const onByTr = new Map(ON.rows.map((r) => [r.tr, r]));
  out.off = offRows.map((r) => ({ key: r.tr, v: { '发货日': r.sd, '平台': pn(r.p), '仓': r.wh, 'WO': r.wo, '渠道': r.wlCh || r.ch, 'SKU': r.sku, '承运商': r.t.carrier,
    '718状态': r.t.st + (r.t.sub && r.t.sub !== r.t.st ? ' / ' + r.t.sub : ''), '停留天数': r.days == null ? null : Math.round(r.days * 10) / 10, '阶段': STAGE[r.lvl] || '',
    '作废面单': r.void ? '是' : '', '查轨迹': 'https://t.17track.net/zh-cn#nums=' + r.tr } }));
  SHEETS.off.stale = (vals, k) => {
    const r = onByTr.get(k); const human = vals['负责人'] || vals['处理结果'];
    if (r && r.on) return human ? { '阶段': '已上线' } : 'delete';
    if ((vals['发货日'] || '') < f30) return human ? null : 'delete';
    return human ? null : 'delete';
  };
  // 上线率汇总
  const g = {};
  for (const r of ON.rows) { if (!r.sd || r.sd < f30) continue; const k = r.sd + '|' + pn(r.p) + '|' + (r.wh || '?'); const o = g[k] || (g[k] = { sd: r.sd, p: pn(r.p), wh: r.wh || '?', tot: 0, on: 0, offs: [] }); o.tot++; if (r.on) o.on++; else if (!r.quiet) o.offs.push(r.tr); else o.on++; }
  out.onl = Object.entries(g).map(([k, o]) => ({ key: k, v: { '发货日': o.sd, '平台': o.p, '仓': o.wh, '总数': o.tot, '已上线': o.on, '未上线': o.tot - o.on, '上线率%': o.tot ? Math.round(o.on / o.tot * 1000) / 10 : null, '未上线明细': o.offs } }));
  // 每日打单汇总
  const dd = {};
  for (const k of M.pkgs) { if (k.d < f60) continue; const key = k.d + '|' + pn(k.p) + '|' + (k.wh || '未匹配'); const o = dd[key] || (dd[key] = { d: k.d, p: pn(k.p), wh: k.wh || '未匹配', n: 0, amt: 0, hn: 0, ha: 0 }); o.n++; o.amt += k.cost; if (hz(k.base)) { o.hn++; o.ha += k.cost; } }
  out.day = Object.entries(dd).map(([k, o]) => ({ key: k, v: { '日期': o.d, '平台': o.p, '仓': o.wh, '包裹数': o.n, '金额': E.r2(o.amt), '危品包裹': o.hn, '危品金额': E.r2(o.ha) } }));
  // 交单核对 SKU
  out.sku = [];
  const whList = [...new Set(M.whOut.map((r) => r.wh).concat(M.whs))];
  for (const wh of whList) {
    const days = E.whFlow(M, f60, E.addDays(today, 1), wh).days;
    for (const d in days) { const day = days[d]; for (const k in day.sku) { const o = day.sku[k]; if (!o.jd && !o.ck) continue;
      const df = day.hasRec ? E.r2(o.jd - o.ck) : null;
      const note = !day.hasRec ? '没有仓库记录' : df > 0 ? (o.jd ? '有 ' + df + ' 件交运了没发走' : '') + (o.voidLab ? '（' + o.voidLab + ' 件面单已作废）' : '') : o.jd === 0 ? '仓库出库不在 WL 订单里（FBA / 批量 / 补发？）' : df < 0 ? '仓库多出库 ' + (-df) : '已全部发走';
      out.sku.push({ key: d + '|' + wh + '|' + o.name, v: { '日期': d, '仓': wh, 'SKU': o.name, '已交运': o.jd, '已发货': day.hasRec ? o.ck : null, '差值': df, '说明': note } }); } }
  }
  // 面单均价（近 8 周）
  out.pr = [];
  const ws0 = E.weekStartOf(today, M.cfg.weekStart);
  for (let i = 0; i < 8; i++) { const ws = E.addDays(ws0, -7 * i); for (const o of E.skuAvg(M, ws, E.addDays(ws, 6))) for (const p in o.byP) { const b = o.byP[p];
    out.pr.push({ key: ws + '|' + o.sku + '|' + pn(p), v: { '周': ws, 'SKU': o.sku, '平台': pn(p), '包裹数': b.n, '金额': E.r2(b.amt), '均价': b.n ? E.r2(b.amt / b.n) : null } }); } }
  // 异常单（近 14 天）
  const ex = new Map(); const add = (key, v) => { if (!ex.has(key)) ex.set(key, { key, v }); };
  for (const D0 of M.dates.filter((d) => d >= f14)) {
    const rc = E.reconcile(M, D0);
    for (const x of rc.voidShipped) add('作废面单发货|' + x.t, { '发现日': D0, '类型': '作废面单发货', '平台': pn(x.l.p), '仓': x.w.wh, 'WO': x.w.wo, '单号': x.t, 'SKU': x.w.skus, '说明': '平台上面单状态“' + x.l.st + '”，仓库仍用它发货；原面单金额 ' + n2(x.l.amt) });
    for (const x of rc.wlNoLab) add('WL没有打单记录|' + x.t, { '发现日': D0, '类型': 'WL没有打单记录', '平台': pn(E.platOfCh(x.w.ch)), '仓': x.w.wh, 'WO': x.w.wo, '单号': x.t, 'SKU': x.w.skus, '说明': 'WL 渠道 ' + x.w.ch + '，状态 ' + x.w.st + (x.voided ? '；平台上有一张已作废的同号面单' : '') });
    for (const x of rc.pend) { const ty = x.type === 'dup' ? '可能重复打单' : '面单在WL找不到';
      add(ty + '|' + x.t, { '发现日': D0, '类型': ty, '平台': pn(x.l.p), '仓': x.w ? x.w.wh : '', 'WO': x.l.wo, '单号': x.t, 'SKU': x.l.sku || (x.w ? x.w.skus : ''), '说明': '面单金额 ' + n2(x.l.amt) + (x.w ? '；WL 已有单号 ' + x.w.trs.join(',') : '') }); }
  }
  for (const r of ON.rows) if (!r.on && !r.quiet && r.lvl >= 3 && r.sd >= f14) add('超时未上线|' + r.tr, { '发现日': r.sd, '类型': '超时未上线', '平台': pn(r.p), '仓': r.wh, 'WO': r.wo, '单号': r.tr, 'SKU': r.sku, '说明': '停留 ' + (r.days == null ? '?' : r.days.toFixed(1)) + ' 天，718：' + r.t.st + (r.void ? '；用的是作废面单' : '') });
  const calc = {};
  for (const p of E.PLATS) for (const r of E.ledgerRows(M, p)) {
    calc[p + '_' + r.d] = { '上一条余额': r.open, '系统打单金额': r.sys, '期末(计算)': r.calc, '差额': r.diff,
      '核对': r.diff == null ? (r.open == null ? '缺期初' : '待填交单后余额') : r.ok ? '对平' : '差 ' + n2(r.diff), '可能原因': r.why.join('；') };
    if (r.ok === false && !r.explained && r.d >= f14) add('余额对不上|' + p + '|' + r.d, { '发现日': r.d, '类型': '余额对不上', '平台': pn(p), '仓': '', 'WO': '', '单号': '', 'SKU': '', '说明': '差 ' + n2(r.diff) + (r.why.length ? '；' + r.why.join('；') : '') });
  }
  out.exc = [...ex.values()];
  SHEETS.exc.stale = (vals) => (vals['发现日'] || '') < f14 ? null : (vals['状态'] === '待处理' && !vals['负责人'] && !vals['处理备注'] ? { '状态': '已自动消除' } : null);
  return { out, calc };
}
async function syncSheets(why) {
  if (S.mode !== 'db' || !window.FS) return;
  if (SYNC.running) { SYNC.again = true; return; }
  SYNC.running = true; SYNC.err = null;
  try {
    do {
      SYNC.again = false;
      setStatus('warn', '正在更新给人看的表…');
      const { out, calc } = sheetRows(); const res = [];
      for (const k of ['off', 'onl', 'day', 'sku', 'pr', 'exc']) { const r = await window.FS.syncSheet(SHEETS[k], out[k]); res.push(SHEETS[k].name + ' +' + r.add + '/改' + r.set + '/删' + r.del); }
      await window.FS.syncLedger(calc);
      SYNC.last = nowStr(); SYNC.res = res;
    } while (SYNC.again);
    setStatus('ok', '多维表格已连接 · 表格已更新 ' + SYNC.last.slice(11, 16));
  } catch (e) { SYNC.err = e; setStatus('warn', '更新表格失败：' + (e.message || e) + '（可在“设置”里点“更新表格”重试）'); console.error(e); }
  SYNC.running = false;
}

// ---------------- boot ----------------
document.addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); const t = e.target.closest('[data-tab]'); if (t) go(t.dataset.tab); });
$('#dSel').addEventListener('change', () => { if ($('#dSel').value) { D = $('#dSel').value; computeAlerts(); render(); } });
const step = (dir) => { if (!M || !M.dates.length) return; const ds = M.dates; let i = dir > 0 ? ds.findIndex((d) => d > D) : ds.length - 1 - [...ds].reverse().findIndex((d) => d < D); if (dir < 0 && ![...ds].some((d) => d < D)) i = -1; if (i >= 0 && i < ds.length) { D = ds[i]; computeAlerts(); render(); } };
$('#dPrev').onclick = () => step(-1); $('#dNext').onclick = () => step(1);
try { const t = localStorage.getItem('dz-tab'); if (t && TABS.some(([k]) => k === t)) TAB = t; } catch (e) {}
rebuild(); render();
READY = initStore().then(() => { rebuild(); render(); }).catch((e) => { setStatus('warn', '多维表格读取失败：' + (e && (e.code || e.message) || e)); });
})();
</script>
